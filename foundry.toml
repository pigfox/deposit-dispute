[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200

# crytic-compile (Echidna, Medusa, Slither) consumes these Foundry artifacts via
# --foundry-ignore-compile, so the fuzzer/analyzer never needs its own solc download.
build_info = true
extra_output = ["storageLayout"]

# Two submodules, and the distinction between them is the whole dependency policy
# of this repo. forge-std is the test library. solidity-pipeline is ESTATE
# INFRASTRUCTURE, consumed rather than copied so a fix to a gate lands once
# instead of once per repo. Neither is a demo repo, and this repo depends on no
# demo repo — not zk-escrow, not ai-parametric-insurance, not any other. The
# patterns re-implemented here were READ from those repos and written fresh.
#
# `test/Properties.sol` imports the shared property base from the pipeline and
# nothing else — no forge-std — so the engine-pure harness stays drivable by
# Echidna and Medusa without dragging a second copy of any library into the
# artifact set that crytic-compile reads.
remappings = [
    "forge-std/=lib/forge-std/src/",
    # PIGFOX SOLIDITY PIPELINE v1, vendored as a submodule. The shared property
    # base lives here; the gate scripts alongside it are what CI runs, so a local
    # run and a CI run are the same bytes.
    "pipeline/=lib/solidity-pipeline/src/",
]

# No [rpc_endpoints] block, deliberately. DIRECT-CHAIN ONLY: every test is a pure
# in-process EVM built from this repo's own source, and the single deployment
# target is Base Sepolia 84532, supplied from the environment at deploy time and
# never named here. Stated as what IS the case, which is the only way to state it
# — the doctrine gate matches its tokens literally, including inside a denial.

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
# depth is the sequence length every engine walks. When echidna.yaml and
# medusa.json land in a later unit their seqLen/callSequenceLength match this, so
# a bug found by one engine is reachable by the rest.
depth = 64
# Every harness entry point swallows its expected reverts by design, so a revert
# surfacing here is a harness bug — not a protocol finding — and must fail loud
# rather than silently shrinking the effective search space.
fail_on_revert = true

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 512
depth = 96

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

# --- forge lint ------------------------------------------------------------
# CANONICAL BLOCK. Copied verbatim from lib/solidity-pipeline/config/lint.toml
# and held in agreement with it by scripts/lint-config-check.sh, which CI runs.
# `forge lint` has no --config-file, so unlike Slither and Solhint this cannot be
# consumed from the submodule; it is the same deliberate copy as echidna.yaml and
# medusa.json, with the same check keeping the copies honest.
# Every exclusion's reasoning is in lib/solidity-pipeline/docs/forge-lint-rules.md.
# This repo adds NOTHING to either list — it holds no generated verifier, which is
# the one documented addition the checker permits.
[lint]
ignore = ["test/**/*.sol", "script/**/*.sol"]
exclude_lints = [
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "unwrapped-modifier-logic",
]
