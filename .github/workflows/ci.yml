name: CI

# Everything here runs on a clean checkout with NO secrets. Build, test,
# coverage, static analysis and property fuzzing need no keys — only deploying
# does, and that is done by hand from a laptop, never here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual only, and it exists for one job: coverage-diagnostics, which is gated
  # on this event so it never runs on a push. Everything else here runs on both
  # of the triggers above and is unaffected by a dispatch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PIGFOX SOLIDITY PIPELINE v1 — the estate's one verification standard, defined
  # once in pigfox/solidity-pipeline and consumed here rather than copied. EVERY
  # gate this repo runs comes from the submodule, verbatim. The only pipeline file
  # that ever lived here was a stand-in for the shared property base, and it was
  # deleted in the same commit that vendored the real one.
  #
  # The gate SCRIPTS come from lib/solidity-pipeline, vendored as a submodule at a
  # commit this repo pins, so a local run and this run are the same bytes. That
  # pin currently resolves to the same commit as the `@v1` ref below, so the
  # orchestration and the gates it runs are one tree.
  #
  # https://github.com/pigfox/solidity-pipeline
  pipeline:
    uses: pigfox/solidity-pipeline/.github/workflows/solidity.yml@v1
    with:
      # test/Properties.sol declares seven echidna_* predicates and states the
      # same number in pigfoxPropertyCount(). Both fuzzers assert they registered
      # exactly this many, so a property that silently stops being picked up fails
      # the job instead of reporting a smaller green run.
      #
      # Bump this, pigfoxPropertyCount(), InvariantsTest's own literal and the
      # predicate together, in one commit.
      expected-properties: 7

      # The default, restored in the commit that added script/ — exactly as the
      # narrowed value said it would be.
      fmt-paths: src test script

      # No coverage exclusion. This repo holds no generated verifier and no other
      # file the 100% gate cannot reach; every line, statement, branch and
      # function in src/ answers to a test. A declared exclusion that matched no
      # row would fail the gate anyway, which is the right behavior — a stale
      # exclusion is a hole that reads as a decision.
      coverage-exclusions: ''

  # DIAGNOSTIC, NOT A GATE. `continue-on-error` is deliberate and is the whole
  # point: this job exists to make the coverage stage's resource use VISIBLE, and
  # a diagnostic that can turn the tree red would be a second gate nobody asked
  # for. The real gate is `pipeline / forge`, unchanged and still authoritative.
  #
  # WHY IT EXISTS. The 100% coverage gate had never run in this repository's CI:
  # every run before the size-gate fix died at `forge build --sizes`, the FIRST
  # step of that job, so `forge coverage` was never reached. The two runs that did
  # reach it both lost the RUNNER rather than failing a check — one announced
  # `The runner has received a shutdown signal` after 8m47s, the other was killed
  # with its step frozen and its log discarded after 49+ minutes. A disappearance
  # is not evidence, so this job samples memory and reports peak RSS as it goes.
  # Whether it passes or dies, the next attempt produces numbers.
  #
  # It runs the SAME command the gate runs, under the SAME FOUNDRY_PROFILE, so its
  # figures describe the gate rather than an approximation of it.
  # ON DEMAND ONLY, AND BOUNDED. Both of those are corrections to how this job
  # first shipped, and the reason is worth keeping: on every push it ran a stage
  # that is known to exhaust the runner, so it squatted a runner for over an hour
  # and would have kept going to GitHub's six-hour ceiling. An instrument that
  # costs a runner-hour per push to re-confirm a known answer is not an
  # instrument, it is a leak. It now runs only when someone asks for it, and it
  # gives up after 30 minutes — well past the ~7 minutes the same work takes on a
  # machine with enough memory, so a timeout here is itself a signal.
  coverage-diagnostics:
    name: coverage resource diagnostics (not a gate)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1.3.1
        with:
          version: v1.4.2

      - name: What this runner has
        run: |
          set -euo pipefail
          echo "nproc:        $(nproc)"
          echo "MemTotal:     $(awk '/MemTotal/{print $2/1048576 " GiB"}' /proc/meminfo)"
          echo "MemAvailable: $(awk '/MemAvailable/{print $2/1048576 " GiB"}' /proc/meminfo)"
          echo "SwapTotal:    $(awk '/SwapTotal/{print $2/1048576 " GiB"}' /proc/meminfo)"
          df -h / | tail -1

      # A background sampler, because peak RSS reported at exit is lost if the
      # process is killed — which is exactly the case being investigated. This
      # prints a line a minute, so a run that dies still leaves a trail showing
      # what memory was doing when it went.
      - name: Coverage under memory sampling
        run: |
          set -uo pipefail
          (
            while true; do
              rss="$(ps -eo rss,comm --no-headers | awk '$2 ~ /forge/ {s+=$1} END {print s+0}')"
              echo "[sample] $(date -u +%H:%M:%S) forge_rss=$((rss/1024))MiB avail=$(awk '/MemAvailable/{printf "%d", $2/1024}' /proc/meminfo)MiB"
              sleep 60
            done
          ) &
          sampler=$!
          rc=0
          /usr/bin/time -v -o time.txt lib/solidity-pipeline/scripts/coverage.sh || rc=$?
          kill "$sampler" 2>/dev/null || true
          echo "=== coverage.sh exit: $rc ==="
          echo "=== /usr/bin/time -v ==="
          cat time.txt || echo "(time.txt absent — the process did not exit normally)"
          exit "$rc"

      - name: Upload the diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: coverage-diagnostics
          path: |
            time.txt
            coverage-summary.txt
          if-no-files-found: warn

  # The off-chain adjudicator panel. Separate from the Solidity pipeline because
  # it gates different things — Go formatting, vet, lint, tests and 100%
  # coverage — against the same contract.
  #
  # NO VENDOR KEY IS NEEDED OR ACCEPTED. Every test substitutes the model seam
  # and the chain seam, so the suite makes no vendor call, reaches no node, and
  # spends nothing. A job that needed a key to go green would be a job only the
  # key holder could run, and everyone else would be reading a skipped stage as a
  # passing one.
  adjudicator:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: adjudicator
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-go@v5.1.0
        with:
          go-version-file: adjudicator/go.mod
          cache-dependency-path: adjudicator/go.sum

      # Formatting first because it is cheapest: a style regression fails in
      # seconds instead of after the whole suite has run. `gofmt -l` prints
      # offending files and nothing else, so empty output is the pass condition.
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "  ok   gofmt: clean"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: adjudicator
          args: --timeout=5m

      # -race and -shuffle=on: the panel walks its slots in order today, and both
      # flags are here so that stops being true loudly rather than silently.
      - name: go test
        run: go test ./... -race -shuffle=on -count=1 -timeout 10m

      # 100% ON EVERY PACKAGE, not on the weighted average. An average lets a
      # large well-tested package carry a small untested one, which is exactly
      # the shape a missed error path makes.
      - name: coverage gate
        run: |
          set -euo pipefail
          go test ./... -covermode=set -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
          if go tool cover -func=coverage.out | grep -v '100.0%'; then
            echo "::error::the lines above are below 100% coverage"
            exit 1
          fi
          echo "  ok   coverage: 100% of statements"
